name: spell-check

on:
  push:
  workflow_dispatch:

jobs:
  documentation-spell-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: cspell check
      uses: streetsidesoftware/cspell-action@v8
      with:
          config: cspell.json
          root: .
          files: |
            content/**/*.md
          incremental_files_only: false
          inline: warning
          suggestions: true
          strict: true
          report: all
